events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Upstream definitions ────────────────────────────────────
    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:8000;
    }

    upstream keycloak {
        server keycloak:8080;
    }

    upstream waltid_issuer {
        server waltid-issuer:7002;
    }

    upstream waltid_verifier {
        server waltid-verifier:7003;
    }

    upstream waltid_wallet {
        server waltid-wallet:3000;
    }

    # ── Main server ─────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Frontend (Angular SPA)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for QR scan real-time updates)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Keycloak
        location /auth/ {
            proxy_pass http://keycloak/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }

        # walt.id Issuer API
        location /waltid/issuer/ {
            proxy_pass http://waltid_issuer/;
            proxy_set_header Host $host;
        }

        # walt.id Verifier API
        location /waltid/verifier/ {
            proxy_pass http://waltid_verifier/;
            proxy_set_header Host $host;
        }

        # walt.id Wallet API
        location /waltid/wallet/ {
            proxy_pass http://waltid_wallet/;
            proxy_set_header Host $host;
        }
    }

    # ── Walt.id Web Wallet (frontend + proxy al wallet API) ────
    server {
        listen 7101;
        server_name localhost;

        # Frontend del web wallet
        location / {
            proxy_pass http://vc-web-wallet:7101;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy /wallet-api/ al backend del wallet
        location /wallet-api/ {
            proxy_pass http://waltid_wallet/wallet-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy issuer API (para resolver credential offers)
        location /openid4vc/ {
            proxy_pass http://waltid-issuer:3000/openid4vc/;
            proxy_set_header Host $host;
        }

        location /draft13/ {
            proxy_pass http://waltid-issuer:3000/draft13/;
            proxy_set_header Host $host;
        }
    }
}