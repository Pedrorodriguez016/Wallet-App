# walt.id Wallet API — OIDC Provider Configuration
# Connects the wallet to Keycloak for user authentication

enableOidcLogin = true
publicBaseUrl = "http://localhost:7001"
providerName = "keycloak"
oidcRealm = "http://localhost:8080/realms/vc-wallet"
oidcJwks = "http://keycloak:8080/realms/vc-wallet/protocol/openid-connect/certs"
oidcScopes = ["openid", "profile", "email"]
jwksCache = {
  cacheSize = 10
  cacheExpirationHours = 24
  rateLimit {
    bucketSize = 10
    refillRateMinutes = 1
  }
}
authorizeUrl = "http://localhost:8080/realms/vc-wallet/protocol/openid-connect/auth"
accessTokenUrl = "http://keycloak:8080/realms/vc-wallet/protocol/openid-connect/token"
logoutUrl = "http://keycloak:8080/realms/vc-wallet/protocol/openid-connect/logout"
clientId = "vc-wallet-backend"
clientSecret = "change-me-in-production"
keycloakUserApi = "http://keycloak:8080/admin/realms/vc-wallet/users"
