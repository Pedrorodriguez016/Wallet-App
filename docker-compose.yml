###############################################################################
# VC-Wallet Platform — Wallet Workspace Docker Compose
# Keycloak + walt.id Community Stack + FastAPI Backend
###############################################################################

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: vc-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vc-network

  # ═══════════════════════════════════════════════════════════════════════════
  # KEYCLOAK — Identity & Access Management
  # ═══════════════════════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: vc-keycloak
    command: start-dev --import-realm --features=token-exchange,admin-fine-grained-authz
    env_file:
      - ./backend/.env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak_secret}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./infrastructure/keycloak/realm-export:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - vc-network

  # ═══════════════════════════════════════════════════════════════════════════
  # WALT.ID — Issuer API (OID4VCI)
  # ═══════════════════════════════════════════════════════════════════════════
  waltid-issuer:
    image: waltid/issuer-api:latest
    container_name: vc-issuer
    volumes:
      - ./infrastructure/waltid/issuer-config:/waltid-issuer-api/config
    ports:
      - "7002:3000"
    networks:
      - vc-network

  # ═══════════════════════════════════════════════════════════════════════════
  # WALT.ID — Verifier API (OID4VP)
  # ═══════════════════════════════════════════════════════════════════════════
  waltid-verifier:
    image: waltid/verifier-api:latest
    container_name: vc-verifier
    volumes:
      - ./infrastructure/waltid/verifier-config:/waltid-verifier-api/config
    ports:
      - "7003:3000"
    networks:
      - vc-network

  # ═══════════════════════════════════════════════════════════════════════════
  # WALT.ID — Wallet API (Custodial Wallet)
  # ═══════════════════════════════════════════════════════════════════════════
  waltid-wallet:
    image: waltid/wallet-api:latest
    container_name: vc-wallet
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - ./infrastructure/waltid/wallet-config:/waltid-wallet-api/config
      - waltid_wallet_data:/waltid-wallet-api/data
    ports:
      - "7001:3000"
    networks:
      - vc-network
  
  # ═══════════════════════════════════════════════════════════════════════════
  # WALT.ID — Wallet WEB (Exposed directly on 7101)
  # ═══════════════════════════════════════════════════════════════════════════
  waltid-web-wallet:
    image: waltid/waltid-web-wallet:latest
    container_name: vc-web-wallet
    platform: linux/amd64
    ports:
      - "7101:3000"
    environment:
      - NUXT_PUBLIC_ISSUER_CALLBACK_URL=http://localhost:7101
      - NUXT_PUBLIC_WALLET_API=http://localhost:7001
    depends_on:
      - waltid-wallet
    networks:
      - vc-network

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND — FastAPI Application
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vc-backend
    env_file:
      - ./backend/.env
    environment:
      # Override URLs to use Docker-internal hostnames instead of localhost
      - KEYCLOAK_URL=http://keycloak:8080
      - WALTID_ISSUER_URL=http://waltid-issuer:3000
      - WALTID_VERIFIER_URL=http://waltid-verifier:3000
      - WALTID_WALLET_URL=http://waltid-wallet:3000
    volumes:
      - ./backend:/app
      - waltid_wallet_data:/waltid-wallet-data:ro
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - keycloak
      - waltid-issuer
      - waltid-verifier
      - waltid-wallet
    networks:
      - vc-network
# ═════════════════════════════════════════════════════════════════════════════
# VOLUMES & NETWORKS
# ═════════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
  waltid_wallet_data:

networks:
  vc-network:
    driver: bridge
